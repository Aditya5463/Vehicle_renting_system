<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DriveEase</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="login">
  <nav>
    <a class="nav-logo" href="index.html">🚗 DriveEase</a>
    <div class="nav-links">
      <a href="vehicles.html">Vehicles</a>
      <a href="login.html" class="active">Login</a>
      <a href="register.html" class="btn-nav">Sign Up</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🚗 DriveEase</div>
      <div class="auth-title">Welcome Back</div>
      <div class="auth-sub">Sign in to your account to continue</div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input id="email" type="email" placeholder="aditya@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" placeholder="Your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-link">Don't have an account? <a href="register.html">Sign up free</a></div>
    </div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
